[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

# Warm black and gold "editing suite" theme; app.py adds the glass panels on top.
[theme]
base = "dark"
primaryColor = "#c9a45a"
backgroundColor = "#0c0a08"
secondaryBackgroundColor = "#1a1612"
textColor = "#f6f1e7"
linkColor = "#e6c47e"
borderColor = "#3a3128"
dataframeBorderColor = "#2c251e"
dataframeHeaderBackgroundColor = "#15120e"
codeBackgroundColor = "#120f0c"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap, sans-serif"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..500&display=swap, monospace"
baseRadius = "14px"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false
