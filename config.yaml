# Model profiles. Swap a model = change one line under `roles`, or run with --profile NAME
# (one-profile mode: every role uses that model). Prices are list USD per 1M tokens, for cost reports only.

profiles:
  # --- Bedrock via the Converse API, signed with your normal AWS login (aws configure / AWS_PROFILE)
  opus46:
    provider: bedrock_converse
    model: us.anthropic.claude-opus-4-6-v1
    alt_models: [global.anthropic.claude-opus-4-6-v1]   # separate quota -> 2x throughput
    rpm: 4.5                                             # account quota is 5 req/min per profile
    price_in: 5.0
    price_out: 25.0
    max_concurrency: 4
  sonnet46:
    provider: bedrock_converse
    model: us.anthropic.claude-sonnet-4-6
    alt_models: [global.anthropic.claude-sonnet-4-6]
    rpm: 4.5
    price_in: 3.0
    price_out: 15.0
    max_concurrency: 6
  gptoss:                     # same open model Groq serves free -> the free-tier judge is identical
    provider: bedrock_converse
    model: openai.gpt-oss-120b-1:0
    extra: {reasoning_effort: low}
    price_in: 0.15
    price_out: 0.60
    max_concurrency: 8
  kimi:
    provider: bedrock_converse
    model: us.moonshotai.kimi-k3.1
    price_in: 0.60
    price_out: 2.50
    max_concurrency: 6
  deepseek:
    provider: bedrock_converse
    model: deepseek.v3.2
    price_in: 0.60
    price_out: 1.70
    max_concurrency: 8
  mistral_large:
    provider: bedrock_converse
    model: mistral.mistral-large-3-675b-instruct
    price_in: 0.50
    price_out: 1.50
    max_concurrency: 8

  # --- Claude in Amazon Bedrock, Opus 4.7+ (Mantle endpoint; needs Anthropic model access enabled on the account)
  opus47:
    provider: anthropic_bedrock
    model: anthropic.claude-opus-4-7
    effort: medium
    thinking: none
    price_in: 5.0
    price_out: 25.0
    max_concurrency: 6

  # --- Open-weight models on Bedrock via its OpenAI-compatible endpoint (same AWS key) - a different model family for the judge
  bedrock_gptoss:
    provider: openai_compat
    base_url: "https://bedrock-mantle.${AWS_REGION}.api.aws/v1"
    api_key_env: AWS_BEARER_TOKEN_BEDROCK
    model: openai.gpt-oss-120b
    json_mode: json_object
    extra: {reasoning_effort: low}
    price_in: 0.15
    price_out: 0.60
    max_concurrency: 6

  # --- Free tiers (optional)
  gemini_lite:
    provider: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    model: gemini-3.5-flash-lite
    json_mode: json_object
    price_in: 0.30
    price_out: 2.50
    max_concurrency: 2
  groq_gptoss:
    provider: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-120b
    json_mode: json_object
    extra: {reasoning_effort: low}
    max_concurrency: 1

  # --- Any OpenAI-compatible endpoint (e.g. one Kuku provides): set LLM_BASE_URL / LLM_MODEL / LLM_API_KEY
  custom:
    provider: openai_compat
    base_url: "${LLM_BASE_URL}"
    api_key_env: LLM_API_KEY
    model: "${LLM_MODEL}"
    json_mode: json_object

  # --- No network: deterministic rules (offline fallback and the 'rules-only' baseline)
  rules:
    provider: rules
    model: rules

roles:
  annotate: opus46        # finds hook & cliffhanger beats per episode
  gate: gptoss            # cold-viewer check (different family from annotate)
  repair: opus46          # picks one setup segment when the cold viewer is lost
  propose: opus46         # field-standard baseline: model proposes whole promos
  judge: opus46           # head-to-head: orders the final shortlist by comparing promos side by side

budget:
  max_calls: 600
  max_usd: 15.0
